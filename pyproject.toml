[project]
name = "weighted-safety-refusal"
version = "0.1.0"
description = "Weighted Safety Refusal evaluation suite for Inspect AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect_ai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wsr-score = "weighted_safety.score:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weighted_safety"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
